<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz — Niveau IA de l'équipe</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <nav class="xnav" aria-label="Navigation entre les pages">
    <a href="index.html" aria-current="page">Quiz</a>
    <a href="claude-code-presentation.html">Claude Code</a>
    <a href="agentique.html">Agentique</a>
    <a href="ia-locale-rag.html">IA locale &amp; RAG</a>
  </nav>
  <style>
  .xnav{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:99999;display:flex;gap:6px;padding:6px 8px;background:rgba(20,20,25,.85);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.15);border-radius:999px;font:500 13px/1 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;box-shadow:0 6px 24px rgba(0,0,0,.35)}
  .xnav a{color:#dfe3ea;text-decoration:none;padding:6px 12px;border-radius:999px;white-space:nowrap}
  .xnav a:hover{background:rgba(255,255,255,.12);color:#fff}
  .xnav a[aria-current="page"]{background:#6c5ce7;color:#fff}
  @media(max-width:560px){.xnav{font-size:12px;flex-wrap:wrap;justify-content:center;bottom:8px;max-width:94vw}}
  </style>
  <main class="wrap">
    <header class="hero">
      <h1 id="quiz-titre">Quiz — Niveau IA de l'équipe</h1>
      <p id="quiz-sous-titre" class="sous-titre"></p>
      <p id="quiz-intro" class="intro"></p>
    </header>

    <!-- Barre de progression -->
    <div class="progress" aria-hidden="true"><div class="progress-bar" id="progressBar"></div></div>

    <!-- Le formulaire est généré par js/app.js -->
    <form id="quizForm" novalidate>
      <div id="questions"></div>

      <div id="erreurGlobale" class="erreur-globale" role="alert" hidden></div>

      <div class="actions">
        <button type="submit" id="submitBtn" class="btn-primary">Valider mes réponses</button>
        <span id="submitState" class="submit-state" aria-live="polite"></span>
      </div>
    </form>

    <!-- Écran de résultats (masqué au départ) -->
    <section id="resultats" class="resultats" hidden aria-live="polite">
      <div class="score-card">
        <div class="score-num"><span id="scoreVal">0</span><span class="score-den">/ 20</span></div>
        <div class="score-pct" id="scorePct">0 %</div>
        <p class="score-msg" id="scoreMsg"></p>
      </div>
      <p id="confirmation" class="confirmation"></p>
      <h2>Correction détaillée</h2>
      <div id="correction" class="correction"></div>
      <button type="button" id="restartBtn" class="btn-secondary">Refaire le quiz</button>
    </section>

    <footer class="footer">
      <p>Réponses individuelles · le score s'affiche à la fin · vos réponses sont enregistrées pour l'équipe.</p>
    </footer>
  </main>

  <script src="js/quiz-data.js"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
